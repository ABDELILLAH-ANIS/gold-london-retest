services:
  - type: web
    name: gold-london-retest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_scanner.py --web
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
